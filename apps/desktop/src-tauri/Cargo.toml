[package]
name = "fmshot-desktop"
description = "FMShot Desktop-App (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Eigener Name für die Bibliothek, sonst kollidiert sie unter Windows mit dem
# Programm, siehe https://github.com/rust-lang/cargo/issues/8519
name = "fmshot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
arboard = "3"
fmshot-capture.workspace = true
fmshot-core.workspace = true
fmshot-hotkeys.workspace = true
fmshot-library.workspace = true
fmshot-overlay.workspace = true
log = "0.4"
sys-locale = "0.3"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
# tauri-specta ist nur als Release Candidate verfügbar – Versionen fest pinnen.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
