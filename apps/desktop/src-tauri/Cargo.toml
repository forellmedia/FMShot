[package]
name = "grabmark-desktop"
description = "Grabmark Desktop-App (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Eigener Name für die Bibliothek, sonst kollidiert sie unter Windows mit dem
# Programm, siehe https://github.com/rust-lang/cargo/issues/8519
name = "grabmark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
dirs = "6"
grabmark-capture.workspace = true
grabmark-clipboard.workspace = true
grabmark-core = { workspace = true, features = ["specta"] }
grabmark-hotkeys.workspace = true
grabmark-library.workspace = true
grabmark-media.workspace = true
grabmark-video = { workspace = true, features = ["gpu", "gif", "layers"] }
grabmark-ocr.workspace = true
grabmark-overlay.workspace = true
grabmark-render.workspace = true
grabmark-settings = { workspace = true, features = ["specta"] }
grabmark-stitch.workspace = true
grabmark-vision.workspace = true
log = "0.4"
sys-locale = "0.3"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
# tauri-specta ist nur als Release Candidate verfügbar – Versionen fest pinnen.
specta.workspace = true
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Bildinhalt-Erkennung mit ONNX Runtime – unter Linux vorerst aus (ADR 0010).
[target.'cfg(not(target_os = "linux"))'.dependencies]
grabmark-vision = { workspace = true, features = ["onnx"] }

[dev-dependencies]
tempfile = "3"
