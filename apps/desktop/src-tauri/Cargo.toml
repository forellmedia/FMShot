[package]
name = "fmshot-desktop"
description = "FMShot Desktop-App (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Eigener Name für die Bibliothek, sonst kollidiert sie unter Windows mit dem
# Programm, siehe https://github.com/rust-lang/cargo/issues/8519
name = "fmshot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
