[package]
name = "nabshot-desktop"
description = "Nabshot Desktop-App (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Eigener Name für die Bibliothek, sonst kollidiert sie unter Windows mit dem
# Programm, siehe https://github.com/rust-lang/cargo/issues/8519
name = "nabshot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
dirs = "6"
nabshot-capture.workspace = true
nabshot-clipboard.workspace = true
nabshot-core = { workspace = true, features = ["specta"] }
nabshot-hotkeys.workspace = true
nabshot-library.workspace = true
nabshot-media.workspace = true
nabshot-video = { workspace = true, features = ["gpu", "gif", "layers"] }
nabshot-ocr.workspace = true
nabshot-overlay.workspace = true
nabshot-render.workspace = true
nabshot-settings = { workspace = true, features = ["specta"] }
nabshot-stitch.workspace = true
nabshot-vision.workspace = true
log = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
sys-locale = "0.3"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
# tauri-specta ist nur als Release Candidate verfügbar – Versionen fest pinnen.
specta.workspace = true
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Bildinhalt-Erkennung mit ONNX Runtime – unter Linux vorerst aus (ADR 0010).
[target.'cfg(not(target_os = "linux"))'.dependencies]
nabshot-vision = { workspace = true, features = ["onnx"] }

[dev-dependencies]
tempfile = "3"
