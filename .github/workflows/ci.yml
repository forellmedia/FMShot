name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Schnelle Prüfungen auf Linux: Format, Clippy, Lizenzen, WASM, Frontend.
  checks:
    name: Prüfungen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Abhängigkeiten für Tauri
        run: ./scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend prüfen und bauen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build:wasm
          npm run check
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: TypeScript-Bindings aktuell?
        run: |
          cargo test -p fmshot-desktop typescript_bindings
          git diff --exit-code apps/desktop/src/lib/bindings.ts || {
            echo "::error::bindings.ts ist veraltet – 'cargo test -p fmshot-desktop' ausführen und committen."
            exit 1
          }
      - name: Renderer als WASM bauen
        run: cargo build -p fmshot-core -p fmshot-render --target wasm32-unknown-unknown
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Tests auf allen Zielplattformen und Architekturen.
  test:
    name: Tests ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows ARM64, os: windows-11-arm }
          - { name: Linux x86_64, os: ubuntu-22.04 }
          - { name: Linux aarch64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: ./scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend bauen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo test --workspace
        if: runner.os != 'Windows'
      # Unter Windows starten Test-Programme, die Tauri linken, nicht
      # (STATUS_ENTRYPOINT_NOT_FOUND – das App-Manifest für comctl32 v6 wird nur
      # ins eigentliche Programm eingebettet). Die App selbst wird trotzdem
      # gebaut; ihre einzigen Tests (Bindings) laufen im Linux-Job.
      - name: cargo test (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --workspace --exclude fmshot-desktop
          cargo build -p fmshot-desktop
