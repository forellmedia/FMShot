name: Release

# Ein Tag `v*` (z. B. v0.1.0) baut alle Plattformen und legt einen
# Release-Entwurf an. Veröffentlicht wird von Hand auf GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Den Entwurf einmal vorab anlegen. Sonst legen die parallelen Build-Jobs
  # gleichzeitig je einen eigenen Entwurf an, und latest.json ist auf beide
  # verteilt (so geschehen bei v0.1.0).
  draft:
    name: Release-Entwurf anlegen
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="FMShot $TAG" -F draft=true \
              -f body="Siehe CHANGELOG. Mac-Hinweis – beim ersten Start unter Systemeinstellungen → Datenschutz & Sicherheit auf „Dennoch öffnen“ klicken." \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: Windows ARM64
            os: windows-11-arm
            args: ""
          # Ubuntu 22.04 als Basis, damit das AppImage auch auf älteren
          # Distributionen läuft (glibc).
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ""
          - name: Linux aarch64
            os: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.rust-targets }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: ./scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend-Abhängigkeiten
        working-directory: apps/desktop
        run: npm ci

      # Selbst erstelltes Zertifikat „FMShot Local Signing“ (ADR 0008).
      # Fehlen die Secrets, wird der Mac-Build ad-hoc signiert.
      - name: Mac-Signatur vorbereiten
        if: runner.os == 'macOS'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/ci-import-mac-cert.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert die Update-Pakete (scripts/make-updater-key.sh).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.release-id }}
          # latest.json für den Updater an das Release hängen.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
