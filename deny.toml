# Lizenz- und Sicherheitsprüfung der Abhängigkeiten (ADR 0008).
# Copyleft-Lizenzen (GPL/AGPL/LGPL) sind bewusst NICHT erlaubt, damit FMShot
# später proprietär verkauft werden kann.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Nur „unmaintained“, keine Sicherheitslücke. Kommt über glib-macros 0.18
  # aus Tauris GTK-Abhängigkeiten unter Linux; nicht von uns behebbar.
  { id = "RUSTSEC-2024-0370", reason = "transitiv über Tauri/GTK, kein Fix verfügbar" },
  # Nur „unmaintained“: paste ist ein Proc-Macro (nur zur Compile-Zeit) und
  # kommt über specta (tauri-specta).
  { id = "RUSTSEC-2024-0436", reason = "transitiv über specta, nur Compile-Zeit" },
  # Nur „unmaintained“: ttf-parser kommt über fontdb (cosmic-text) und liest
  # ausschliesslich die mitgelieferte Schrift Inter, keine fremden Dateien.
  { id = "RUSTSEC-2026-0192", reason = "über fontdb, liest nur mitgelieferte Schriften" },
  # zip 4.6 kommt über tauri-plugin-updater 2.14 (neueste stabile Version;
  # zip >= 9 erst ab Updater 3.0-alpha). Die Lücken betreffen das Entpacken
  # fremder Archive. Der Updater entpackt nur unsere eigenen Release-Archive,
  # und zwar erst nach geprüfter minisign-Signatur. Entfernen, sobald der
  # Updater eine neuere zip-Version mitbringt.
  { id = "RUSTSEC-2026-0367", reason = "zip über Updater, nur signierte eigene Archive" },
  { id = "RUSTSEC-2026-0368", reason = "zip über Updater, nur signierte eigene Archive" },
  { id = "RUSTSEC-2026-0369", reason = "zip über Updater, nur signierte eigene Archive" },
  # Nur „unmaintained“: zbus_names, zvariant und zvariant_derive kommen über
  # zbus aus tauri-plugin-opener und -single-instance (nur Linux, D-Bus).
  # Entfernen, sobald die Plugins die Nachfolger verwenden.
  { id = "RUSTSEC-2026-0370", reason = "zvariant über zbus aus Tauri-Plugins" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names über zbus aus Tauri-Plugins" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive über zbus aus Tauri-Plugins" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  # MPL-2.0 ist dateibezogenes Copyleft: Nutzung in proprietärer Software ist
  # erlaubt, nur Änderungen an MPL-Dateien selbst müssen offengelegt werden.
  # Wird von Tauri-Abhängigkeiten (z. B. cssparser) benötigt.
  "MPL-2.0",
  # Independent JPEG Group: freizügig, verlangt nur einen Hinweis in der
  # Dokumentation („based in part on the work of the IJG“). jpeg-encoder.
  "IJG",
]

[licenses.private]
# Eigene Crates (publish = false) nicht prüfen.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
