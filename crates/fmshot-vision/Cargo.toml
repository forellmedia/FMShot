[package]
name = "fmshot-vision"
description = "Bildinhalt erkennen: Bild und Suchtext als Vektor (SigLIP 2, ADR 0010)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fmshot-core.workspace = true
thiserror.workspace = true
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
  "std",
  "download-binaries",
  "tls-native",
  "copy-dylibs",
  "api-27",
] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }

[features]
# Modelle ausführen. Unter Linux vorerst aus: die fertige ONNX Runtime
# braucht eine neuere glibc als Ubuntu 22.04 (ADR 0010).
onnx = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
fmshot-render.workspace = true
