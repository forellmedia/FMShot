[package]
name = "grabmark-media"
description = "Video und Ton: Bildschirm als Video, Mikrofon, Kodieren (ADR 0011)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
grabmark-core.workspace = true
grabmark-video.workspace = true
log = "0.4"
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = [
  "objc2-core-media",
  "objc2-core-video",
  "objc2-quartz-core",
] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-image = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-quartz-core = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"

[dev-dependencies]
grabmark-video = { workspace = true, features = ["gpu"] }
tempfile = "3"
