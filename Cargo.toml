[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.95"
authors = ["forellmedia.ch"]
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/forellmedia/FMShot"

[workspace.dependencies]
fmshot-core = { path = "crates/fmshot-core" }
fmshot-render = { path = "crates/fmshot-render" }
fmshot-render-wasm = { path = "crates/fmshot-render-wasm" }
fmshot-capture = { path = "crates/fmshot-capture" }
fmshot-clipboard = { path = "crates/fmshot-clipboard" }
fmshot-settings = { path = "crates/fmshot-settings" }
fmshot-stitch = { path = "crates/fmshot-stitch" }
fmshot-ocr = { path = "crates/fmshot-ocr" }
fmshot-library = { path = "crates/fmshot-library" }
fmshot-hotkeys = { path = "crates/fmshot-hotkeys" }
fmshot-overlay = { path = "crates/fmshot-overlay" }
fmshot-vision = { path = "crates/fmshot-vision" }
fmshot-media = { path = "crates/fmshot-media" }
fmshot-video = { path = "crates/fmshot-video", default-features = false }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Grösse und Tempo des Release-Builds, siehe https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Kein `panic = "abort"`: wry fängt Objective-C-Exceptions von WebKit mit
# `objc2::exception::catch` ab. Mit „abort“ beendet jede solche Exception die
# ganze App (Absturz beim Abspielen von Videos im Editor).
strip = true
