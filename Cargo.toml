[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-beta.3"
edition = "2024"
rust-version = "1.95"
authors = ["forellmedia.ch"]
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/forellmedia/Nabshot"

[workspace.dependencies]
nabshot-core = { path = "crates/nabshot-core" }
nabshot-render = { path = "crates/nabshot-render" }
nabshot-render-wasm = { path = "crates/nabshot-render-wasm" }
nabshot-capture = { path = "crates/nabshot-capture" }
nabshot-clipboard = { path = "crates/nabshot-clipboard" }
nabshot-settings = { path = "crates/nabshot-settings" }
nabshot-stitch = { path = "crates/nabshot-stitch" }
nabshot-ocr = { path = "crates/nabshot-ocr" }
nabshot-library = { path = "crates/nabshot-library" }
nabshot-hotkeys = { path = "crates/nabshot-hotkeys" }
nabshot-overlay = { path = "crates/nabshot-overlay" }
nabshot-vision = { path = "crates/nabshot-vision" }
nabshot-media = { path = "crates/nabshot-media" }
nabshot-video = { path = "crates/nabshot-video", default-features = false }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Grösse und Tempo des Release-Builds, siehe https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Kein `panic = "abort"`: wry fängt Objective-C-Exceptions von WebKit mit
# `objc2::exception::catch` ab. Mit „abort“ beendet jede solche Exception die
# ganze App (Absturz beim Abspielen von Videos im Editor).
strip = true
