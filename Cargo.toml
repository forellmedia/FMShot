[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.95"
authors = ["forellmedia.ch"]
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/forellmedia/Grabmark"

[workspace.dependencies]
grabmark-core = { path = "crates/grabmark-core" }
grabmark-render = { path = "crates/grabmark-render" }
grabmark-render-wasm = { path = "crates/grabmark-render-wasm" }
grabmark-capture = { path = "crates/grabmark-capture" }
grabmark-clipboard = { path = "crates/grabmark-clipboard" }
grabmark-settings = { path = "crates/grabmark-settings" }
grabmark-stitch = { path = "crates/grabmark-stitch" }
grabmark-ocr = { path = "crates/grabmark-ocr" }
grabmark-library = { path = "crates/grabmark-library" }
grabmark-hotkeys = { path = "crates/grabmark-hotkeys" }
grabmark-overlay = { path = "crates/grabmark-overlay" }
grabmark-vision = { path = "crates/grabmark-vision" }
grabmark-media = { path = "crates/grabmark-media" }
grabmark-video = { path = "crates/grabmark-video", default-features = false }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Grösse und Tempo des Release-Builds, siehe https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Kein `panic = "abort"`: wry fängt Objective-C-Exceptions von WebKit mit
# `objc2::exception::catch` ab. Mit „abort“ beendet jede solche Exception die
# ganze App (Absturz beim Abspielen von Videos im Editor).
strip = true
